<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Agenda | PetCare Planner</title>

    <link rel="stylesheet" href="../assets/css/base.css">
    <link rel="stylesheet" href="../assets/css/components.css">
    <link rel="stylesheet" href="../assets/css/agenda.css">
</head>

<body data-page="agenda">
    <a class="skip-link" href="#main-content">Saltar al contenido principal</a>

    <div class="page agenda-page">
        <div data-layout-sidebar></div>
        <header class="app-container app-topbar">
            <div data-layout-brand></div>
        </header>

        <main id="main-content" class="app-container">
            <header class="page-header agenda-intro">
                <h1 class="page-title">Agenda de cuidados</h1>
                <p class="page-subtitle">Organizá vacunas, paseos y otros cuidados de tus mascotas.</p>
            </header>

            <div class="agenda-workspace">
                <section class="card task-form-section" aria-labelledby="task-form-title">
                    <h2 id="task-form-title">Agregar cuidado</h2>
                    <p id="task-pet-help" class="alert alert-info" hidden>
                        Para agendar un cuidado, <a href="./mascotas.html">registrá una mascota</a>.
                    </p>

                    <form id="task-form" class="form">
                        <div class="form-group">
                            <label class="form-label" for="task-pet">Mascota (obligatorio)</label>
                            <select class="form-select" id="task-pet" required>
                                <option value="">Seleccionar mascota</option>
                            </select>
                        </div>

                        <div class="form-group">
                            <label class="form-label" for="task-title">Título (obligatorio)</label>
                            <input class="form-input" id="task-title" type="text" required placeholder="Ej. Vacuna antirrábica">
                        </div>

                        <div class="agenda-schedule">
                            <div class="form-group">
                                <label class="form-label" for="task-date">Fecha (obligatorio)</label>
                                <input class="form-input" id="task-date" type="date" required>
                            </div>
                            <div class="form-group">
                                <label class="form-label" for="task-time">Hora</label>
                                <input class="form-input" id="task-time" type="time">
                            </div>
                        </div>

                        <div class="form-group">
                            <label class="form-label" for="task-description">Descripción</label>
                            <textarea class="form-textarea" id="task-description"></textarea>
                        </div>

                        <button class="btn btn-primary" type="submit">Guardar cuidado</button>
                    </form>

                    <p id="task-message" role="status" aria-atomic="true"></p>
                </section>

                <section class="agenda-tasks" aria-labelledby="agenda-tasks-title">
                    <h2 id="agenda-tasks-title">Cuidados agendados</h2>
                    <div class="agenda-filters" role="group" aria-label="Filtrar cuidados por estado">
                        <button class="chip" type="button" data-filter="all" aria-pressed="true">Todas</button>
                        <button class="chip" type="button" data-filter="overdue" aria-pressed="false">Vencidas</button>
                        <button class="chip" type="button" data-filter="today" aria-pressed="false">Hoy</button>
                        <button class="chip" type="button" data-filter="upcoming" aria-pressed="false">Próximas</button>
                        <button class="chip" type="button" data-filter="done" aria-pressed="false">Realizadas</button>
                    </div>
                    <div id="tasks-list"></div>
                </section>
            </div>
        </main>

        <div data-layout-bottom-nav></div>
        <footer data-layout-footer></footer>
    </div>

    <script src="../assets/js/data.js"></script>
    <script src="../assets/js/utils.js"></script>
    <script src="../assets/js/storage.js"></script>
    <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
    <script src="../assets/js/layout.js"></script>
    <script src="../assets/js/agenda.js"></script>
</body>

</html>
